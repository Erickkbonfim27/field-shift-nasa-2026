<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450"><rect width="980" height="450" fill="#fcfcfb"/><text x="40" y="26" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Solo raso por talhão com SRTM: o declive sozinho erra o Neossolo Litólico</text><text x="40" y="46" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">Fração da área marcada como "possível solo raso" em 210 ha mapeados em SMO (UDESC: 38,2% Neossolo Regolítico + Litólico) e</text><text x="40" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">nos 3 perfis descritos. Limiares escolhidos depois de ver os 3 perfis.</text><text x="240" y="106" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">declive ≥ 20</text><rect x="250" y="90" width="57.9" height="22" fill="#2a78d6"><title>área UDESC: 11%</title></rect><text x="312.8567786114956" y="106" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">11%</text><circle cx="700" cy="101" r="9" fill="#1baf7a"><title>P5: acerta</title></circle><text x="700" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="760" cy="101" r="9" fill="#1baf7a"><title>P6: acerta</title></circle><text x="760" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="820" cy="101" r="9" fill="#eb6834"><title>P7: erra</title></circle><text x="820" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✗</text><text x="240" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">declive ≥ 12</text><rect x="250" y="130" width="194.5" height="22" fill="#2a78d6"><title>área UDESC: 36%</title></rect><text x="449.4707510745246" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">36%</text><circle cx="700" cy="141" r="9" fill="#1baf7a"><title>P5: acerta</title></circle><text x="700" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="760" cy="141" r="9" fill="#1baf7a"><title>P6: acerta</title></circle><text x="760" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="820" cy="141" r="9" fill="#eb6834"><title>P7: erra</title></circle><text x="820" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✗</text><text x="240" y="186" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">declive ≥ 15</text><rect x="250" y="170" width="130.7" height="22" fill="#2a78d6"><title>área UDESC: 24%</title></rect><text x="385.6621985867269" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">24%</text><circle cx="700" cy="181" r="9" fill="#1baf7a"><title>P5: acerta</title></circle><text x="700" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="760" cy="181" r="9" fill="#1baf7a"><title>P6: acerta</title></circle><text x="760" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="820" cy="181" r="9" fill="#eb6834"><title>P7: erra</title></circle><text x="820" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✗</text><text x="240" y="226" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">TPI90 ≥ 2</text><rect x="250" y="210" width="112.4" height="22" fill="#2a78d6"><title>área UDESC: 21%</title></rect><text x="367.39163691993883" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">21%</text><circle cx="700" cy="221" r="9" fill="#1baf7a"><title>P5: acerta</title></circle><text x="700" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="760" cy="221" r="9" fill="#eb6834"><title>P6: erra</title></circle><text x="760" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✗</text><circle cx="820" cy="221" r="9" fill="#1baf7a"><title>P7: acerta</title></circle><text x="820" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><text x="240" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">declive ≥ 15 ou TPI90 ≥ 2</text><rect x="250" y="250" width="203.5" height="22" fill="#2a78d6"><title>área UDESC: 37%</title></rect><text x="458.4676185619582" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">37%</text><circle cx="700" cy="261" r="9" fill="#1baf7a"><title>P5: acerta</title></circle><text x="700" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="760" cy="261" r="9" fill="#1baf7a"><title>P6: acerta</title></circle><text x="760" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="820" cy="261" r="9" fill="#1baf7a"><title>P7: acerta</title></circle><text x="820" y="265" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><text x="240" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="normal">declive ≥ 20 ou TPI90 ≥ 2</text><rect x="250" y="290" width="149.2" height="22" fill="#2a78d6"><title>área UDESC: 27%</title></rect><text x="404.209586945436" y="306" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">27%</text><circle cx="700" cy="301" r="9" fill="#1baf7a"><title>P5: acerta</title></circle><text x="700" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="760" cy="301" r="9" fill="#1baf7a"><title>P6: acerta</title></circle><text x="760" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><circle cx="820" cy="301" r="9" fill="#1baf7a"><title>P7: acerta</title></circle><text x="820" y="305" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">✓</text><line x1="457.37142857142857" x2="457.37142857142857" y1="84" y2="330" stroke="#0b0b0b" stroke-dasharray="5 4"/><text x="457.37142857142857" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">mapa UDESC: 38,2%</text><text x="700" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P5</text><text x="760" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P6</text><text x="820" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="normal">P7</text><text x="700" y="66" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">perfis: acerta (✓) ou erra (✗)</text><text x="40" y="400" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">SRTM 30 m dá declive de 10,5% / 21,3% / 9,6% nos perfis 5 / 6 / 7; a medida de campo foi 9% / 38% / 19%. O SRTM suaviza o</text><text x="40" y="414" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">relevo e subestima o declive.</text><text x="40" y="418" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">P7 é topo de encosta, pedregoso, solo &lt; 50 cm: declive baixo e posição convexa (TPI 90 m = +4,9 m). Fonte: cálculo V3</text><text x="40" y="432" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">(v3_06_srtm_solo_raso.py); UDESC, Müller (2020).</text></svg>