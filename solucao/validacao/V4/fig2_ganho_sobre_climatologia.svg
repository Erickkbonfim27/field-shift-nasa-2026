<rect class="mk" x="753.5" y="118.5" width="22.0" height="109.5" rx="2" fill="var(--s2)"><title>Cebola Itu|microrregião · só flag de extremo: +0.22</title></rect>
<rect class="mk" x="777.5" y="119.5" width="22.0" height="108.5" rx="2" fill="var(--s3)"><title>Cebola Itu|microrregião · água + flag: +0.22</title></rect>
<rect class="mk" x="801.5" y="140.5" width="22.0" height="87.5" rx="2" fill="var(--s4)"><title>Cebola Itu|microrregião · motor completo (6 variáveis): +0.17</title></rect>
<text x="777.5" y="396" text-anchor="middle" class="sm ">Cebola Itu</text>
